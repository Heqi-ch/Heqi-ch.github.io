<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频通话邀请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 来电界面 */
        .incoming-call {
            text-align: center;
            color: white;
            animation: fadeIn 0.5s ease;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 24px;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.15);
            background-color: #333;
        }

        .caller-name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .call-status {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 60px;
            animation: pulse 2s infinite;
        }

        .call-buttons {
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        .btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-accept {
            background: #4cd964;
            box-shadow: 0 4px 20px rgba(76, 217, 100, 0.5);
        }

        .btn-accept:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(76, 217, 100, 0.6);
        }

        .btn-reject {
            background: #ff3b30;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);
        }

        .btn-reject:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(255, 59, 48, 0.6);
        }

        /* 视频通话界面 */
        .video-call {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
            animation: fadeIn 0.5s ease;
        }

        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .local-preview {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 120px;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            background: #222;
        }

        .local-preview .avatar-small {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 36px;
        }

        .call-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .control-btn.active {
            background: #ff3b30;
        }

        .control-btn.hangup {
            background: #ff3b30;
        }

        .caller-info-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .caller-info-bar .mini-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
        }

        .call-timer {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- 来电界面 -->
    <div class="incoming-call" id="incomingCall">
        <img class="avatar" src="https://heqi-ch.github.io/123.jpg" alt="对方头像">
        <div class="caller-name">邓小平</div>
        <div class="call-status">邀请您视频通话...</div>
        
        <div class="call-buttons">
            <button class="btn btn-reject" onclick="rejectCall()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
            <button class="btn btn-accept" onclick="acceptCall()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 视频通话界面 -->
    <div class="video-call" id="videoCall">
        <video class="remote-video" id="remoteVideo" muted loop playsinline>
            <source src="https://www.bilibili.com/video/BV1eKe46XEHW?t=6.0">
        </video>
        
        <div class="caller-info-bar">
            <img class="mini-avatar" src="https://heqi-ch.github.io/123.jpg" alt="对方头像">
            <span>邓小平</span>
            <span class="call-timer" id="callTimer">00:00</span>
        </div>
        
        <div class="local-preview">
            <div class="avatar-small">我</div>
        </div>
        
        <div class="call-controls">
            <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="静音">
                <svg id="muteIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <button class="control-btn" title="关闭摄像头">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
            </button>
            <button class="control-btn hangup" onclick="endCall()" title="挂断">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        let timerInterval;
        let seconds = 0;
        let isMuted = true;

        function acceptCall() {
            document.getElementById('incomingCall').classList.add('hidden');
            document.getElementById('videoCall').style.display = 'block';
            
            const video = document.getElementById('remoteVideo');
            video.load();
            
            // 先播放视频
            video.play().then(() => {
                // 用户点击交互后，解除静音
                video.muted = false;
                isMuted = false;
                updateMuteButton();
            }).catch(err => {
                console.error('播放失败:', err);
                alert('视频播放失败，请检查网络或视频地址');
            });
            
            startTimer();
        }

        function rejectCall() {
            alert('已拒绝通话');
        }

        function endCall() {
            clearInterval(timerInterval);
            document.getElementById('videoCall').style.display = 'none';
            document.getElementById('incomingCall').classList.remove('hidden');
            seconds = 0;
            document.getElementById('callTimer').textContent = '00:00';
            
            const video = document.getElementById('remoteVideo');
            video.pause();
            video.currentTime = 0;
            video.muted = true;
            isMuted = true;
            updateMuteButton();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('callTimer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // 静音切换功能
        function toggleMute() {
            const video = document.getElementById('remoteVideo');
            isMuted = !isMuted;
            video.muted = isMuted;
            updateMuteButton();
        }

        // 更新静音按钮样式
        function updateMuteButton() {
            const btn = document.getElementById('muteBtn');
            const icon = document.getElementById('muteIcon');
            
            if (isMuted) {
                btn.classList.add('active');
                icon.innerHTML = `
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                `;
            } else {
                btn.classList.remove('active');
                icon.innerHTML = `
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                `;
            }
        }
    </script>
</body>
</html>
